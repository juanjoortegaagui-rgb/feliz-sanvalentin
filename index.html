<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>San Valentín 💞</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #1e7f43;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: white;
    }

    .container {
      background: rgba(0, 0, 0, 0.35);
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      z-index: 2;
      max-width: 90%;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
    }

    #yes {
      background: #6bff9e;
      color: #004d26;
    }

    #no {
      background: #ff6b6b;
      color: white;
      position: absolute;
    }

    .hidden {
      display: none;
    }

    img {
      max-width: 260px;
      border-radius: 20px;
      margin-top: 15px;
    }

    .heart {
      position: absolute;
      font-size: 22px;
      animation: float 6s linear infinite;
      pointer-events: none;
    }

    @keyframes float {
      from { transform: translateY(100vh); opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>

<audio id="music" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<div class="container" id="question">
  <h1>¿Quieres ser mi San Valentín? 💞</h1>
  <button id="yes">Sí, te amo</button>
  <button id="no">No, te odio</button>
</div>

<div class="container hidden" id="thanks">
  <h2>Gracias por elegirme, por quedarte siempre y por hacer mi vida más bonita cada día 💞</h2>
</div>

<div class="container hidden" id="final">
  <h1>Feliz San Valentín, mi amor 💞</h1>
  <h2>Por el resto de mi vida, espero siempre seas tú en mi vida, te amo princesita.</h2>
  <img src="foto.jpg" alt="Nosotros">
</div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const music = document.getElementById("music");

  let greenHeartsInterval;
  let pinkHeartsInterval;
  let musicStarted = false;

  function moveNo() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("touchstart", moveNo);

  // Música desde la primera interacción
  document.body.addEventListener("click", startMusic, { once: true });
  document.body.addEventListener("touchstart", startMusic, { once: true });

  function startMusic() {
    if (!musicStarted) {
      music.play();
      musicStarted = true;
    }
  }

  // Corazones verdes iniciales
  greenHeartsInterval = setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💚";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 400);

  yesBtn.addEventListener("click", () => {
    document.getElementById("question").classList.add("hidden");
    document.getElementById("thanks").classList.remove("hidden");

    clearInterval(greenHeartsInterval);

    setTimeout(() => {
      document.getElementById("thanks").classList.add("hidden");
      document.getElementById("final").classList.remove("hidden");

      pinkHeartsInterval = setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💞";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = "32px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }, 200);

    }, 2200);
  });
</script>

</body>
</html>
